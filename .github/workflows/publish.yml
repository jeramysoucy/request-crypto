name: Publish Package to npmjs
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm install

      - name: Verify package version matches the release tag
        run: |
          version=$(npm pkg get version | tr -d '"')
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::release tag $tag does not match package.json version $version"
            exit 1
          fi

      # Prerelease versions must not take over the `latest` dist-tag: a bare `npm publish`
      # uses `latest` regardless of the semver prerelease component.
      - name: Resolve npm dist-tag
        id: dist
        run: |
          version=$(npm pkg get version | tr -d '"')
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "publishing $version under dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm publish --tag ${{ steps.dist.outputs.tag }}
        env:
          NPM_CONFIG_PROVENANCE: true